# 무인 진행 품질 게이트.
#
# 왜 이게 없었나:
#   저장소에 실행 가능한 검증이 없었다. 사람이 로컬에서 손으로 열어 볼 수밖에
#   없었고, 그 사람이 빠진 순간 깨진 상태로 머지된다. 카드 도구는 이식성 없는
#   절대경로 때문에 로컬 밖에서는 아예 실행되지 않았다.
#
# 이 워크플로가 하는 일:
#   1. 문법 검사 — 프로토타입 인라인 스크립트와 공통 데이터
#   2. 프로토타입 회귀 테스트 — 계층 저장·수정 모드·확정/취소·6개 화면 기동
#   3. 카드 파서·번들 테스트 — 픽스처 재현성까지
#   4. 생성물 드리프트 — 커밋된 번들이 생성기와 어긋나는지
#
# 이 워크플로의 quality-gate 잡은 의존성이 없다. package.json 도 lock 파일도 요구하지 않는다(§30).
#
# 앱 게이트:
#   - FE(React/Vite): 2026-10-17 에 package.json·lock 이 이미 있어 frontend-gate 잡으로 추가했다.
#     (로컬 검증: vitest 8/8 PASS, tsc --noEmit 클린, vite build 성공)
#   - BE(Spring): 2026-10-18 부터 backend-gate 잡이 돈다 (wrapper + 메인 클래스 완비, §37.6).
#     DB 연결 전이라 테스트는 Postgres 없이 돈다(application.yml 의 exclude, §37.6).

name: quality-gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Node 버전: 저장소 문서에 정해진 최소 버전은 아직 없다(§30 은 패키지
      # 관리자만 규정하고 Node 버전은 다루지 않는다). 여기서는 LTS 라인(22)을
      # 고정한다. 테스트는 node:fs·node:url·node:path·node:vm·node:zlib
      # ·node:child_process 만 쓰므로 18 이상이면 동작한다.
      # 근거 없이 "저장소가 요구하는 버전" 이라 적지 않는다.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 문법 검사 (프로토타입 공통 스크립트)
        run: node --check design/prototype/common/mock-data.js

      - name: 문법 검사 (카드 파서)
        run: |
          node --check apps/frontend/src/lib/card/card-common.mjs
          node --check apps/frontend/src/lib/card/parse-samsung.mjs
          node --check apps/frontend/src/lib/card/parse-hyundai.mjs

      - name: 프로토타입 회귀 테스트
        run: node design/prototype/tools/run-all.mjs

      # 실제 카드 명세는 개인정보라 저장소에 없다.
      # ASSETFLOW_CARD_REAL_DIR 을 주지 않으면 해당 검사는 "건너뜀" 으로 끝난다.
      # 비어 있는 상태로 일부러 두어, 그 상태에서 통과하는 것을 확인한다.
      - name: 카드 파서·번들 테스트 (개인정보 파일 없음)
        run: |
          node samples/card/tools/test-parse-samsung.mjs
          node samples/card/tools/test-parse-hyundai.mjs
          node samples/card/tools/test-card-ui.mjs

      # 위 검사들은 픽스처를 다시 생성해 커밋본과 바이트 단위로 비교한다.
      # 여기서 또 확인하는 이유: 생성기가 조용히 빈 파일을 만들면
      # 바이트 비교는 "일치" 로 통과하고 아무도 눈치채지 못한다.
      - name: 생성물이 커밋본과 같은지 확인
        run: |
          if [ -n "$(git status --porcelain -- samples/card/anonymized design/prototype/common/card-import.js)" ]; then
            echo "::error::생성물이 커밋본과 다릅니다. 생성기를 실행하고 결과물을 커밋하세요."
            git status --porcelain -- samples/card/anonymized design/prototype/common/card-import.js
            git diff -- samples/card/anonymized design/prototype/common/card-import.js | head -100
            exit 1
          fi

      - name: 결과 요약
        run: echo "quality-gate 통과"

  # FE 앱 게이트. quality-gate 잡과 독립적으로 돈다.
  # package.json 의 packageManager(pnpm@9.15.4)로 도구 버전을 고정하고,
  # lock 파일이 어긋나면 --frozen-lockfile 이 실패하게 한다.
  frontend-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: pnpm 활성화 (packageManager 필드 고정본)
        run: corepack enable
      - name: 의존성 설치 (lock 고정)
        run: pnpm install --frozen-lockfile
      - name: 타입 검사
        run: pnpm typecheck
      - name: 단위 테스트
        run: pnpm test
      - name: eslint
        run: pnpm lint
      - name: 프로덕션 빌드
        run: pnpm build
        
  e2e-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: pnpm 활성화 (packageManager 필드 고정본)
        run: corepack enable
      - name: 의존성 설치 (lock 고정)
        run: pnpm install --frozen-lockfile
      - name: Playwright 브라우저 설치
        run: pnpm exec playwright install chromium
      - name: E2E 테스트
        run: pnpm e2e
        
  # BE 앱 게이트. 2026-10-18 부터 백엔드가 실제로 빌드·테스트 가능하다
  # (wrapper + 메인 클래스, §37.6). DB 전 부팅이므로 테스트는 Postgres 없이 돈다.
  backend-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: 컴파일·테스트
        run: ./gradlew compileJava test --console=plain --no-daemon
