plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.assetflow'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '21'
}

// §37 DDL 단일 출처(apps/backend/db/schema.sql)를 classpath 로 서빙 —
// spring.sql.init 이 postgres 프로필 부팅 시 이 파일을 그대로 적용한다.
sourceSets {
    main {
        resources {
            srcDir 'db'
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'
    implementation 'org.springframework.security:spring-security-crypto'   // BCrypt 비밀번호 검증 (§21)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'                        // 실제 JWT 발급·검증 (Known Issues 3)
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.jsoup:jsoup:1.17.2'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
