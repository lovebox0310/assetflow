plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.assetflow'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '21'
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// §37 DDL 단일 출처(apps/backend/db/schema.sql)를 classpath 로 서빙 —
// spring.sql.init 이 postgres 프로필 부팅 시 이 파일을 그대로 적용한다.
sourceSets {
    main {
        resources {
            srcDir 'db'
        }
    }
}

// §29.3 단일 출처: 카드 컬럼 계약을 FE 와 같은 파일에서 읽는다.
// 복사본을 저장소에 두지 않고 빌드할 때 리소스로 넣어 드리프트를 막는다.
processResources {
    from('../../samples/card/card-columns.json') {
        into 'card'
    }
}

// 테스트에만 쓰는 익명화 샘플도 같은 원본에서 복사한다.
processTestResources {
    from('../../samples/card/anonymized') {
        include 'samsungcard-personal-anon.csv'
        include 'hyundaicard-personal-anon.csv'
        include 'synthetic-sample.xlsx'
        include 'synthetic-novat.xlsx'
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.3'
    implementation 'org.springframework.security:spring-security-crypto'   // BCrypt 비밀번호 검증 (§21)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'                        // 실제 JWT 발급·검증 (Known Issues 3)
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.jsoup:jsoup:1.17.2'
    // §29.2 BE 재검증: 업로드된 평문 XLSX를 서버에서 다시 읽는다.
    // 암호화(CFB)는 열지 않는다(§29.5.1) — POI도 EncryptedDocumentException 으로 실패한다.
    implementation 'org.apache.poi:poi-ooxml:5.2.5'
    // §63 이메일 명세서 자동 수집 — IMAP 첨부 다운로드
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}
