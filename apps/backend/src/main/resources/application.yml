spring:
  application:
    name: assetflow-backend
  # Issue #7(데이터 모델)에서 PostgreSQL 연결이 추가되기 전까지는
  # DB 없이 부팅 가능해야 Issue #3 AC(로컬 실행 확인)를 만족하므로,
  # DataSource/JPA/MyBatis 자동 구성을 제외한다.
  # DB 연결 도입 시 이 exclude 를 제거하고 아래 datasource 를 활성화한다:
  #   datasource:
  #     url: ${DB_URL}
  #     username: ${DB_USER}
  #     password: ${DB_PASSWORD}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
      - org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration

server:
  port: ${SERVER_PORT:8080}

app:
  # 배포 프론트엔드 출처(쉼표 구분). 미설정이면 CORS 미허용(동일 출처만).
  allowed-origins: ${ALLOWED_ORIGIN:}
  # JWT 서명 키. 이 매핑이 없으면 TokenService 가 부팅마다 랜덤 키를 만들어
  # 재시작 때마다 모든 토큰이 무효화된다(운영 JWT_SECRET 무시).
  jwt-secret: ${JWT_SECRET:}
  # bizno.net 이 접속대기로 막을 때 대신 읽는 리더 서비스(비우면 폴백 없음).
  business-info:
    fallback-reader: ${BIZNO_FALLBACK_READER:https://r.jina.ai/}
  # §61 은행 잔액 빠른조회(bankapi.co.kr). 무료·이메일 가입으로 즉시 발급된다.
  # 키가 비어 있으면 연결 시도 시 503(BANK_NOT_CONFIGURED) — 조용히 실패하지 않는다.
  # 국내 IP 에서만 호출된다(해외 배포는 403).
  bank:
    api-key: ${BANK_API_KEY:}
    secret-key: ${BANK_SECRET_KEY:}
    base-url: ${BANK_API_BASE_URL:https://api.bankapi.co.kr}
    # 계좌번호 암호화 키(AES/GCM). 비우면 JWT_SECRET, 둘 다 없으면 기동마다 랜덤
    # (개발 편의 — 운영에서는 반드시 고정값).
    link-key: ${BANK_LINK_KEY:}
  # §62 한국투자증권 Open API(KIS Developers) 연동.
  # 모의투자 기본 도메인. 실전 전환 시 KIS_BASE_URL 을 교체하거나 계좌별 baseUrl 을 지정한다.
  # enabled=false 이면 sync API 는 503(KIS_NOT_CONFIGURED) 을 돌려준다.
  # appKey/appSecret 은 §62.2 에서 계좌별로 DB(kis_account_credentials)에 암호화 저장한다.
  kis:
    enabled: ${KIS_ENABLED:false}
    base-url: ${KIS_BASE_URL:https://openapivts.koreainvestment.com:29443}
    # 한국투자증권 접근토큰 유효기간(초). 기본 24시간 — 재발급 직전 10분 여유를 둔다.
    token-expiry-seconds: ${KIS_TOKEN_EXPIRY_SECONDS:86400}
  # §63 현대카드 VestMail 이메일 명세서 자동 수집
  card:
    # AES/GCM 암호화 키. 비우면 JWT_SECRET, 둘 다 없으면 기동마다 랜덤(개발 편의).
    import-key: ${CARD_IMPORT_KEY:}
    email-import:
      # 1일 2회: 09:00, 21:00
      cron: ${CARD_EMAIL_IMPORT_CRON:0 0 9,21 * * *}
    vestmail:
      hyundai:
        # Node 스크립트 디렉토리. 비우면 classpath에서 임시 복사.
        # 운영 예: /opt/assetflow/scripts/card/vestmail-hyundai
        script-dir: ${VESTMAIL_HYUNDAI_SCRIPT_DIR:}
