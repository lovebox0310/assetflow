spring:
  application:
    name: assetflow-backend
  # Issue #7(데이터 모델)에서 PostgreSQL 연결이 추가되기 전까지는
  # DB 없이 부팅 가능해야 Issue #3 AC(로컬 실행 확인)를 만족하므로,
  # DataSource/JPA/MyBatis 자동 구성을 제외한다.
  # DB 연결 도입 시 이 exclude 를 제거하고 아래 datasource 를 활성화한다:
  #   datasource:
  #     url: ${DB_URL}
  #     username: ${DB_USER}
  #     password: ${DB_PASSWORD}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.jpa.JpaRepositoriesAutoConfiguration
      - org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration

server:
  port: ${SERVER_PORT:8080}

app:
  # 배포 프론트엔드 출처(쉼표 구분). 미설정이면 CORS 미허용(동일 출처만).
  allowed-origins: ${ALLOWED_ORIGIN:}
  # JWT 서명 키. 이 매핑이 없으면 TokenService 가 부팅마다 랜덤 키를 만들어
  # 재시작 때마다 모든 토큰이 무효화된다(운영 JWT_SECRET 무시).
  jwt-secret: ${JWT_SECRET:}
