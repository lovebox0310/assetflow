# postgres 프로필: 실 DB 연결. 기동 시 --spring.profiles.active=postgres 와
# DB_URL/DB_USER/DB_PASSWORD 환경변수가 필요하다.
# 베이스 application.yml 의 autoconfigure.exclude 를 빈 값으로 덮어써
# DataSource/JPA/MyBatis 자동구성을 활성화한다.
spring:
  autoconfigure:
    exclude:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data-seed.sql
      continue-on-error: true   # 이미 테이블이 있으면 CREATE TABLE 을 무시하고 진행

app:
  # 단일 사용자 MVP의 원장 소유자 — 이 이메일 행이 asset_accounts·card_imports 의 user_id 가 된다.
  # 시드(data-seed.sql)와 일치시키거나, 운영 DB에서 해당 이메일 행을 직접 만들어 둔다.
  owner-email: ${OWNER_EMAIL:user@example.com}
